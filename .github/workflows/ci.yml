name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 数据与内联一致性校验
        run: python data/build.py --check
      - name: 数据质量自检
        run: python data/check_data.py
      - name: 结构与资源体检（重复 id / 孤儿引用 / meta / PWA / 版本徽章 / 无障碍）
        run: python data/check_html.py
