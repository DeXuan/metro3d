name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 数据与内联一致性校验
        run: python data/build.py --check
      - name: 数据质量自检
        run: python data/check_data.py
      - name: 结构与资源体检（重复 id / 孤儿引用 / meta / PWA / 版本徽章 / 无障碍）
        run: python data/check_html.py
      - name: 静默失败门禁（空 catch 吞异常 / __errbuf 缺失）
        run: python data/check_errors.py

  # 浏览器 E2E（v2.2.0）：12 条核心路径，桌面 + 移动双视口。
  # 依赖静态检查先通过，避免在产物不一致的情况下跑浏览器测试。
  # 注意：这里再跑一遍三项静态检查是有意的——它同时证明「被测产物就是本次提交的产物」，
  # 避免 job 之间 checkout 漂移导致测到过期页面。
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 数据与内联一致性校验
        run: python data/build.py --check
      - name: 数据质量自检
        run: python data/check_data.py
      - name: 结构与资源体检（重复 id / 孤儿引用 / meta / PWA / 版本徽章 / 无障碍）
        run: python data/check_html.py
      - name: 安装 E2E 依赖与 Chromium
        working-directory: e2e
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: 运行 E2E（离线 file:// 模式，无需服务器）
        working-directory: e2e
        run: npx playwright test
      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
