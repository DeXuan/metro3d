name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 构建校验（数据一致性 + JS 语法）
        run: |
          python data/build.py --check
          python data/check_data.py
      - name: 打包产物
        run: |
          mkdir -p dist
          cp index.html dist/metro3d-standalone.html
          zip -q dist/metro3d-site.zip index.html README.md README.en.md LICENSE CHANGELOG.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/metro3d-standalone.html
            dist/metro3d-site.zip
